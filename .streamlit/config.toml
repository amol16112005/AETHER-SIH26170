[theme]
base = "dark"
primaryColor = "#4FC3F7"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151B2E"
textColor = "#E8EEF9"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
